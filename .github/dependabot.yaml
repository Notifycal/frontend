version: 2
updates:
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the default location of `.github/workflows`. (You don't need to
    # specify `/.github/workflows` for `directory`. You can use `directory: "/"`.)
    directory: '/'
    schedule:
      interval: 'daily'
      time: '18:45'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '18:45'
    registries:
      - npm-github-registry

  - package-ecosystem: 'terraform'
    directory: '/tf'
    schedule:
      interval: 'daily'
      time: '18:45'
    registries:
      - terraform-github

registries:
  npm-github-registry:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PAT}}

  terraform-github:
    type: git
    url: 'https://github.com/Notifycal'
    token: ${{secrets.DEPENDABOT_PAT}}
